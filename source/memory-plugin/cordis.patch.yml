# dsh-memory 单入口 bundle patch —— 一个包,一条 entry。
#
# 发布包里的 patch 是**纯 insert、不带 config**(为了可热挂载:宿主的 hot-mount 只支持
# 纯 insert 行,带 config/表达式就只能重启生效)。这里这份是开发期的配置样例。
- id: dsh-memory
  name: '@restregular/dsh-memory'
  config:
    storeDir: !!js process.env.DSH_MEMORY_DIR ?? '.dsh-memory'
    scopes:
      global: true
      project: true
    retrieval:
      topK: 5
      recallN: 30
      globalThreshold: 0.12
      projectThreshold: 0.1
      vector:
        enabled: true
        endpoint: !!js process.env.DSH_MEMORY_EMBED_ENDPOINT ?? 'http://127.0.0.1:8078/v1/embeddings'
        model: bge-m3
        dims: 1024
    limits:
      maxRecordsPerScope: 2000
      maxRecordChars: 4000
    secrets:
      enabled: true
      mode: refuse
    tools:
      defaultScope: project
      # projectScope 缺省用 project:<cwd>;要固定团队库可显式指定
    inject:
      enabled: true
      tokenBudget: 500
      topK: 5
    panel:
      route: '/memory/api'
